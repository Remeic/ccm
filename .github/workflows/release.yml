name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'remeic/homebrew-tap' }}
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      NPM_PUBLISH_ACCESS: ${{ vars.NPM_PUBLISH_ACCESS || 'public' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test:coverage
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          # Trusted publishing must not fall back to the setup-node auth token.
          rm -f "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN

          PUBLISH_ARGS=(publish --access "$NPM_PUBLISH_ACCESS")

          if [[ "$NPM_PUBLISH_ACCESS" == "public" ]]; then
            PUBLISH_ARGS+=(--provenance)
          fi

          npm "${PUBLISH_ARGS[@]}"
      - name: Resolve npm tarball
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        id: npm-tarball
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")"

          for attempt in {1..12}; do
            if TARBALL_URL="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" dist.tarball --silent 2>/dev/null)"; then
              if [[ -n "$TARBALL_URL" ]]; then
                echo "url=$TARBALL_URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Failed to resolve npm tarball for ${PACKAGE_NAME}@${PACKAGE_VERSION}" >&2
          exit 1
      - name: Compute Homebrew sha256
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        id: tarball-sha
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.npm-tarball.outputs.url }}" -o package.tgz
          SHA256="$(shasum -a 256 package.tgz | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Generate Homebrew formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        run: |
          node scripts/homebrew/generate-formula.mjs \
            --version "${{ needs.release-please.outputs.version }}" \
            --sha256 "${{ steps.tarball-sha.outputs.sha256 }}" \
            --output homebrew-tap/Formula/ccm.rb
      - name: Publish Homebrew formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        shell: bash
        working-directory: homebrew-tap
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/ccm.rb; then
            echo "Homebrew formula already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ccm.rb
          git commit -m "chore: update ccm to ${RELEASE_VERSION}"
          git push
      - name: Homebrew tap not configured
        if: env.HOMEBREW_TAP_GITHUB_TOKEN == ''
        run: echo "Skipping Homebrew tap publish because HOMEBREW_TAP_GITHUB_TOKEN is not set."
