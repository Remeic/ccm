name: Bug Report
description: Report a bug in ccm
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `ccm ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Node Version
      placeholder: "e.g. macOS 15 / Node 22.x"
    validations:
      required: true

  - type: input
    id: ccm-version
    attributes:
      label: ccm Version
      placeholder: "e.g. 0.3.0"
    validations:
      required: true
